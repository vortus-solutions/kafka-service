name: CI

on:
    push:
    pull_request:

jobs:
    unit:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [18, 20, 22]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test -- --runInBand
            - run: npm run build
            - run: npm pack --dry-run
            - run: npm audit --omit=dev

    integration:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: docker compose up --detach --wait
            - run: KAFKA_INTEGRATION=true npm run test:integration
            - if: always()
              run: docker compose down --volumes
